# Every number the engine uses. Each numeric leaf is {value, category, why}.
# category: M = measured from our data / fitted traces, C = cited published default,
#           D = derived arithmetically (derivation in `why`), S = scenario choice, J = judgement (sensitivity in REASONING.md)

meta:
  schema_version: "1.0"
  now: "2026-10-20T00:00:00+05:30"
  window_start: "2026-09-20T00:00:00+05:30"
  timezone: "Asia/Kolkata"

time_units:      # the only bare numbers allowed in engine code are these, plus 0, 1 and 100
  slot_minutes:   {value: 5,   category: D, why: "metrics are sampled every 5 minutes (data contract PLAN.md 4.2)"}
  slots_per_hour: {value: 12,  category: D, why: "60 minutes / 5-minute samples"}
  slots_per_day:  {value: 288, category: D, why: "24 hours x 12 samples per hour"}
  hours_per_day:  {value: 24,  category: D, why: "calendar: hours in a day"}
  days_per_week:  {value: 7,   category: D, why: "calendar: days in a week"}
  hours_per_week: {value: 168, category: D, why: "24 hours x 7 days in a week"}
  minutes_per_hour: {value: 60, category: D, why: "calendar: minutes in an hour"}
  hours_per_month: {value: 730, category: C, why: "cloud billing convention (8,760 h / 12); same as pricing.csv"}
  days_per_month: {value: 30, category: D, why: "the replay budget is 'per month'; scaled by observed days / 30"}
  saturday_index: {value: 5, category: D, why: "pandas dayofweek: Monday = 0 ... Saturday = 5, Sunday = 6"}
  ms_per_second: {value: 1000, category: D, why: "unit conversion for the benchmark report (seconds -> milliseconds)"}
  bytes_per_mb: {value: 1000000, category: D, why: "unit conversion for the benchmark report (bytes -> MB, decimal)"}
  mbps_to_mb_per_hour: {value: 450, category: D, why: "1 Mbps x 3,600 s / 8 bits = 450 MB per hour"}

percentiles:
  prod:    {value: 99, category: C, why: "AWS Compute Optimizer default is P99.5; p99 is the conservative read that still ignores single noisy samples. Used for evidence and the one-off test ('p99 without the busiest day'); sizing reads the same value from the selected preset"}
  nonprod: {value: 95, category: C, why: "AWS 'maximum savings' style preset for lower-stakes environments; catalogue doc recommends p95 for dev/staging"}

evidence:
  report_percentiles: {value: [50, 95, 99], category: D, why: "the schema's evidence block reports cpu/mem p50, p95 and p99"}
  io_net_percentile: {value: 95, category: C, why: "catalogue: IOPS and network vetoes are stated on p95"}
  trend_percentile: {value: 95, category: C, why: "PLAN.md 6: trend is a linear fit of daily p95 CPU"}

clean:
  flatline_hours: {value: 2, category: J, why: "a live agent never reports the exact same CPU+memory pair for 24 consecutive 5-min samples; 2 h is long enough to avoid catching brief steady states and short enough to catch a stuck agent within a day"}
  interp_max_slots: {value: 3, category: J, why: "gaps up to 15 min are bridged for replay continuity only; longer gaps stay NaN because interpolating them would invent load"}
  pct_min: {value: 0, category: D, why: "physical lower bound of a percentage"}

gates_data:
  min_history_days: {value: 14, category: C, why: "AWS Compute Optimizer requires 14 days before it recommends; below that weekly cycles are seen at most once"}
  recent_resize_days: {value: 14, category: D, why: "same as min_history_days: the post-change machine needs its own 14 days of evidence"}
  min_coverage: {value: 0.8, category: J, why: "catalogue quality gate; at 80% a missing 20% would have to be concentrated in peaks to hide them, which peak-window coverage checks separately"}
  medium_coverage: {value: 0.95, category: J, why: "between 80% and 95% the resource is evaluated but flagged MEDIUM_COVERAGE and gets +1 risk point"}
  day_min_coverage: {value: 0.5, category: J, why: "a day counts towards history only if at least half of it was observed"}
  anomaly_ratio: {value: 3.0, category: J, why: "catalogue: a 3x level shift is far outside daily variation (fitted drift sd is 0.11-0.59), so sizing on it would be sizing on an incident"}
  anomaly_recent_hours: {value: 48, category: J, why: "two days: long enough to be sustained, short enough to catch an incident before the monthly report"}
  peak_coverage_min: {value: 0.5, category: J, why: "if fewer than half of the days were observed during the VM's busiest hours, the peak itself is unknown"}
  peak_hours_top: {value: 2, category: J, why: "the two busiest hours of the day define the 'peak window' (a 40-min batch fits in one or two hours)"}
  bucket_coverage_min: {value: 0.5, category: J, why: "candidate b: any hour-of-week bucket under 50% observed is treated as a blind spot"}

gates_policy:
  stopped_recent_days: {value: 30, category: C, why: "catalogue: 'stopped > 30 days, still billing'; a shorter stop is treated as maintenance"}

peaks:
  rolling_slots: {value: 6, category: J, why: "30-minute rolling mean (6 x 5 min): a sustained peak, not a single sample; matches the alert rule's 30-minute persistence"}
  peak_level: {value: 80, category: J, why: "a VM running above 80% for 30 min is busy enough that halving it would overload it (80 x 2 > 90 overload line)"}
  recurring_min_days: {value: 4, category: D, why: "a weekly job appears 4-5 times in 30 days, so >= 4 separates 'weekly or more often' from one-offs"}
  p99_min: {value: 80, category: D, why: "candidate a: same as peak_level so the p99 condition and the daily-peak condition talk about the same busy level"}
  autocorr_min: {value: 0.3, category: J, why: "candidate c: autocorrelation above 0.3 at a 24 h or 168 h lag is a clear periodic signal on 30 days of data"}
  looks_wasteful_mean: {value: 20, category: J, why: "PLAN.md 7: an average-based tool would shrink anything averaging under 20% CPU; these are the VMs the Rejections panel must explain"}

noncompute:
  orphan_age_days: {value: 7, category: C, why: "catalogue / Datadog practice: unattached for > 7 days, so a disk being set up right now is not caught"}
  oversized_used_max: {value: 0.2, category: C, why: "catalogue: < 20% of provisioned storage used"}
  volume_target_used: {value: 0.7, category: J, why: "after a shrink the volume should be at most 70% full, leaving 30% growth room"}
  volume_sizes: {value: [50, 100, 200, 250, 500, 1000], category: S, why: "standard sizes offered by the provider (illustrative)"}
  growth_days_to_full: {value: 30, category: J, why: "a volume projected to reach the full line within a month must not be shrunk"}
  full_level: {value: 90, category: J, why: "disks above 90% are operationally full (alerts, fragmentation)"}

vetoes:
  mem_p99: {value: 70, category: C, why: "catalogue memory veto; leaves 25+ points before the 95% OOM cap"}
  iops_p95: {value: 70, category: C, why: "catalogue IOPS veto: disk-bound workloads do not recover gracefully when IO is squeezed"}
  net_p95: {value: 60, category: C, why: "catalogue network veto: a proxy is 'quiet by CPU, essential in fact'"}
  leak_min_resets: {value: 3, category: J, why: "three or more sharp memory drops in 30 days is a repeating restart cycle, not a one-off restart"}
  leak_drop: {value: 25, category: J, why: "a drop of 25 points between consecutive samples is a process restart, far above memory noise (fitted sd 3.1)"}
  reserved_mem_level: {value: 75, category: J, why: "memory flat above 75% looks like a reserved heap rather than load"}
  reserved_mem_std: {value: 1, category: M, why: "measured separation in our data: a reserved heap (prod-search-06) has sd 0.50, a cache under load (prod-cache-04) still moves with sd 1.21; PLAN.md 7 said 2, which cannot tell them apart"}
  growth_target: {value: 85, category: J, why: "projected CPU reaching 85% is 'near capacity' (5 points under the overload line)"}
  growth_horizon_days: {value: 60, category: J, why: "a change should still be safe two months later"}
  growth_pvalue: {value: 0.05, category: C, why: "conventional significance level for the trend slope (candidate b)"}

patterns:
  oneoff_p99: {value: 80, category: D, why: "same busy level as peaks.peak_level"}
  oneoff_rest_max: {value: 40, category: D, why: "without the top day the VM would be 'underused' (vetoes/candidates use 40)"}
  oneoff_second_day_max: {value: 50, category: J, why: "candidate b: second-busiest day under 50% means the top day really is alone"}
  quiet_ratio: {value: 0.2, category: J, why: "the last week runs at under a fifth of the earlier level"}
  quiet_recent_days: {value: 7, category: J, why: "one full weekly cycle"}
  quiet_prior_min_mean: {value: 5, category: D, why: "same as the idle line: a VM that was always idle cannot 'go quiet'"}

candidates:
  idle_cpu: {value: 5, category: C, why: "industry consensus idle line (catalogue; Azure Advisor / Datadog use ~5%)"}
  idle_mem: {value: 70, category: D, why: "same as vetoes.mem_p99: a memory-resident process is not idle"}
  idle_net_mb_per_h: {value: 5, category: C, why: "candidate b: PLAN.md 7 absolute network idle line"}
  idle_iops_abs: {value: 5, category: C, why: "candidate b: PLAN.md 7 absolute IOPS idle line"}
  idle_net_pct_bw: {value: 0.1, category: M, why: "candidate c: real network is lognormal with sigma 1.99 (fitted), so absolute MB/h lines flag idle VMs as busy; 0.1% of plan bandwidth (~1 Mbps on 1 Gbps) scales with plan size"}
  idle_iops_pct: {value: 1, category: M, why: "candidate c: idle disk IO under 1% of provisioned IOPS at p95; fitted IO spread (sigma 1.06) makes 5 absolute IOPS too strict"}
  underused_cpu: {value: 40, category: C, why: "catalogue: CPU P < 40 leaves room after 20-30% headroom"}
  underused_mem: {value: 50, category: C, why: "catalogue: memory P < 50"}
  offhour_percentile: {value: 95, category: C, why: "PLAN.md 7: an hour is off if its p95 is under the line in every week"}
  offhour_cpu: {value: 5, category: D, why: "same as the idle line: an hour is 'off' only if it is idle"}
  offhours_min_block_h: {value: 4, category: J, why: "stopping and starting for less than 4 hours saves little and adds boot risk"}
  offhours_min_week_h: {value: 40, category: J, why: "under 40 h/week (~24%) the schedule's saving is small relative to its operational cost"}
  wake_buffer_min: {value: 30, category: J, why: "start the VM 30 min before activity so it is warm (boot + cache warm-up)"}
  template_off_start_h: {value: 20, category: S, why: "candidate a: fixed what-if template 'off 20:00-08:00 + weekends'"}
  template_off_end_h: {value: 8, category: S, why: "candidate a: fixed what-if template"}

sizing:
  target_cpu_prod: {value: 70, category: C, why: "AWS default headroom 20-30% -> sized peak at <= 70% in prod"}
  target_cpu_nonprod: {value: 80, category: C, why: "20% headroom (AWS default) for lower-stakes environments"}
  target_mem: {value: 75, category: J, why: "memory p99 after resize <= 75%: OOM crashes, so more room than CPU's 'slows down'"}
  overload_level: {value: 90, category: C, why: "catalogue / execution plan: CPU above 90% is overload in Peak Replay"}
  overload_budget_prod_min: {value: 0, category: C, why: "execution plan: prod tolerates zero replayed overload minutes"}
  overload_budget_nonprod_min: {value: 30, category: C, why: "execution plan: dev/staging tolerate 30 min per month of replayed overload"}
  mem_cap: {value: 95, category: C, why: "execution plan: no replayed memory sample above 95% (OOM territory)"}
  prod_max_steps: {value: 1, category: C, why: "FinOps practice: one plan step per prod change keeps it small and reversible"}
  upsize_level: {value: 90, category: D, why: "same as overload_level: saturated at p99 in normal operation"}
  core_target_small: {value: 60, category: J, why: "candidate d (Erlang-C rule of thumb): 1-2 vCPU queues build earlier, so lower target"}
  core_target_medium: {value: 70, category: J, why: "candidate d: 4 vCPU"}
  core_target_large: {value: 75, category: J, why: "candidate d: 6+ vCPU absorb bursts better"}
  core_small_max: {value: 2, category: J, why: "candidate d: 'small' = up to 2 vCPU"}
  core_medium_max: {value: 4, category: J, why: "candidate d: 'medium' = up to 4 vCPU"}
  nonprod_target_bonus: {value: 10, category: D, why: "candidate d: non-prod gets the same +10 points as target_cpu_nonprod - target_cpu_prod"}
  trend_pvalue: {value: 0.05, category: C, why: "candidate d: forward replay only for statistically significant growth"}
  forward_days: {value: 30, category: J, why: "candidate d: replay the load as it will be one month from now"}
  second_peak_rank: {value: 2, category: J, why: "size on the 2nd-busiest day: robust to one outlier day, still sees any weekly job (4-5 occurrences)"}

risk:
  bootstrap_draws: {value: 500, category: J, why: "standard error of a probability p is sqrt(p(1-p)/500) <= 2.2 points, fine enough for 2%/10% cut-offs; 5x fewer draws doubles it"}
  seed: {value: 42, category: S, why: "fixed seed so every run is identical"}
  low_max: {value: 0.02, category: J, why: "under 2% chance of any overload in a month: roughly one bad day in four years of months"}
  medium_max: {value: 0.10, category: J, why: "under 10%: one month in ten; above that a human must look first"}
  schedule_active_cpu: {value: 20, category: J, why: "activity inside an off-window counts only above 20% (clearly not idle noise)"}
  points_prod: {value: 3, category: C, why: "PLAN.md 7 risk table: prod +3"}
  points_staging: {value: 1, category: C, why: "PLAN.md 7 risk table: staging +1"}
  points_stateful: {value: 2, category: C, why: "PLAN.md 7 risk table: stateful +2"}
  points_proj_high: {value: 2, category: C, why: "PLAN.md 7: projected p99 > 70 -> +2"}
  points_proj_mid: {value: 1, category: C, why: "PLAN.md 7: projected p99 50-70 -> +1"}
  proj_high: {value: 70, category: C, why: "PLAN.md 7 risk table boundary"}
  proj_mid: {value: 50, category: C, why: "PLAN.md 7 risk table boundary"}
  bursty_ratio: {value: 3, category: C, why: "PLAN.md 7: p99 / p50 > 3 counts as bursty, +1"}
  points_delete: {value: 2, category: C, why: "PLAN.md 7: delete +2"}
  points_stop: {value: 1, category: C, why: "PLAN.md 7: stop +1"}
  low_points_max: {value: 2, category: C, why: "PLAN.md 7: 0-2 Low"}
  medium_points_max: {value: 4, category: C, why: "PLAN.md 7: 3-4 Medium, 5+ High"}

cost:
  floor_inr: {value: 500, category: C, why: "catalogue: below Rs 500/month a recommendation is not worth a human's attention (applies to compute changes; deleting/releasing unused resources has no blast radius)"}

alerts:
  spike_mad_k: {value: 4, category: C, why: "execution plan: a spike is 4 robust sigmas above the median of the same hour of the week; the median/MAD baseline is not inflated by the spike itself, unlike mean/standard deviation"}
  mad_to_sigma: {value: 1.4826, category: D, why: "consistency constant: for normal data sigma = 1.4826 x MAD, so k x 1.4826 x MAD is a k-sigma robust threshold (plain 4 x MAD is only ~2.7 sigma)"}
  spike_min_level: {value: 50, category: J, why: "a 'spike' that stays under 50% CPU is not operationally interesting, however unusual"}
  capacity_level: {value: 90, category: C, why: "execution plan: alert when the trend reaches 90% (CPU, memory or disk)"}
  trend_days_warning: {value: 30, category: C, why: "execution plan: days until 90% < 30 -> warning"}
  trend_days_critical: {value: 7, category: C, why: "execution plan: capacity < 7 days -> critical"}
  trend_lookback_days: {value: 14, category: C, why: "execution plan: straight-line fit on the last 14 days (recent slope, not the month's average)"}
  trend_pvalue: {value: 0.05, category: C, why: "only statistically significant slopes raise a capacity alert (same as vetoes.growth_pvalue)"}
  cost_jump_ratio: {value: 1.1, category: M, why: "billing is piecewise constant (87% of team-days unchanged), so every change is a provisioning event and there is no noise to guard against; in the window the steps are +12.9% and +12.7% (new VMs) vs +2.4%, -1.7%, -3.4% (a volume, a stop, a resize). 1.1 separates material provisioning from routine changes; the execution plan's 1.2 would miss both new-VM events"}
  cost_window_days: {value: 7, category: C, why: "execution plan: trailing 7-day average (one weekly cycle)"}
  cost_lookback_days: {value: 30, category: D, why: "cost jumps are reported for the same 30-day window as the metrics"}
  budget_base_days: {value: 90, category: D, why: "budgets are set from the first quarter (90 days) of the 180-day billing history"}
  budget_multiplier: {value: 1.25, category: S, why: "scenario: each team's monthly budget = 125% of its first-quarter monthly spend (the bill then grew ~40%, so several teams overrun)"}
  budget_critical_over: {value: 0.10, category: C, why: "execution plan: forecast more than 10% over budget -> critical"}
  runrate_days: {value: 7, category: D, why: "month-end forecast = spent so far + (mean of the last 7 days) x days left"}

benchmark:
  target_vms: {value: 1000, category: S, why: "PLAN.md scale story: show the engine on a ~1,000-VM fleet (about 9x the demo fleet)"}

backtest:
  split_day: {value: 23, category: D, why: "30 days - 7: decide on 23 days (still >= 14), test on the last full week so every weekday is seen once out of sample"}

score:
  w_correct: {value: 4, category: J, why: "correctness carries the brief's 25% safety criterion plus the edge-case contract: the largest single weight"}
  w_safety: {value: 3, category: J, why: "an unsafe downsize is the worst possible outcome; weighted just below correctness only because it is binary and already near-guaranteed by replay"}
  w_explain: {value: 2, category: J, why: "the brief's 20% transparency criterion; half of correctness because a clear wrong answer is still wrong"}
  w_robust: {value: 1, category: J, why: "tie-breaker: a logic that flips when thresholds move 10% is fragile, but fragility alone should not beat correctness"}
  safety_one_unsafe: {value: 1, category: J, why: "one unsafe downsize keeps a third of the safety points; more than one gets none"}
  accept_min: {value: 7, category: J, why: "7/10 = full safety + explainability (5) plus at least half correctness (2): a component must be right more often than not"}
  switch_margin: {value: 0.5, category: J, why: "re-loops only switch an earlier choice for a real improvement (half a point), not for noise"}
  perturb: {value: 0.1, category: C, why: "plan: robustness = verdict flips when every threshold of the component moves +/-10%"}
  flip_good: {value: 0.05, category: J, why: "under 5% of verdicts flipping is robust (1 point)"}
  flip_ok: {value: 0.15, category: J, why: "under 15% is acceptable (0.5 points)"}
  partial: {value: 0.5, category: J, why: "a part that is half-met earns half its weight (explainability, robustness)"}
  explain_full: {value: 0.99, category: J, why: "explainability full marks: essentially every fired signal is visible (rounding slack only)"}
  explain_half: {value: 0.5, category: J, why: "explainability half marks: most fired signals are visible"}
  auc_chance: {value: 0.5, category: D, why: "AUC of a random ranking; correctness = (AUC - 0.5) / 0.5 so random = 0 and perfect = 1"}
  auc_steps: {value: [1, 2], category: J, why: "risk AUC test: deliberately aggressive downsizes of one and two plan steps, so both safe and unsafe outcomes occur"}
  max_passes: {value: 3, category: J, why: "coordinate ascent cap; selections are expected to settle in 1-2 passes"}
  sensitivity_small: {value: 0.1, category: C, why: "ledger sensitivity at +/-10%"}
  sensitivity_large: {value: 0.25, category: J, why: "ledger sensitivity at +/-25%"}

presets:
  default:         {percentile_prod: 99, percentile_nonprod: 95, target_cpu_prod: 70, target_cpu_nonprod: 80, budget_prod: 0, budget_nonprod: 30}
  max_savings:     {percentile_prod: 90, percentile_nonprod: 90, target_cpu_prod: 90, target_cpu_nonprod: 90, budget_prod: 60, budget_nonprod: 60}
  balanced:        {percentile_prod: 95, percentile_nonprod: 95, target_cpu_prod: 80, target_cpu_nonprod: 80, budget_prod: 30, budget_nonprod: 30}
  max_performance: {percentile_prod: 99.5, percentile_nonprod: 99.5, target_cpu_prod: 60, target_cpu_nonprod: 60, budget_prod: 0, budget_nonprod: 0}
